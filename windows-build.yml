name: Windows Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Edge TTS runtime dependency
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if (Test-Path python_deps) { Remove-Item -Recurse -Force python_deps }
          python -m pip install edge-tts -t python_deps

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Build release EXE
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Stage artifact
        shell: pwsh
        run: |
          $stage = "dist/readtis-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item src-tauri/target/release/readtis.exe $stage/
          Copy-Item -Recurse python_deps $stage/python_deps
          Copy-Item README.md $stage/
          Set-Content -Path "$stage/Run Readtis.bat" -Encoding ASCII -Value @(
            '@echo off',
            'start "" "%~dp0readtis.exe"'
          )
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/readtis-windows-x64.zip" -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: readtis-windows-x64
          path: dist/readtis-windows-x64
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/readtis-windows-x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
